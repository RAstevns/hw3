<html lang="en">

<head>
    <meta charset="UTF-8">

    <!--   Stylesheet   -->
    <link rel="stylesheet" href="css/styles.css">

    <!--   Javascript   -->
    <script type="text/javascript" src="js/timestable.js"></script>

    <!--   Title   -->
    <title>Multiplication Table</title>
</head>

<body>
    <header>
        <h1>
            Multiplication Table Generator
        </h1>
    </header>
    <fieldset id="form-fieldset">
        <legend>Please enter values:</legend>
        <form onsubmit="generateTable(event); return false;" id="form">
            <div>
                <label> Minimum column value </label>
                <input type="number" name="mincol" placeholder="Enter integer between -50 and 50">
            </div>
            <div>
                <label> Maximum column value </label>
                <input type="number" name="maxcol" placeholder="Enter integer between -50 and 50">
            </div>
            <div>
                <label> Minimum row value </label>
                <input type="number" name="minrow" placeholder="Enter integer between -50 and 50">
            </div>
            <div>
                <label> Maximum row value </label>
                <input type="number" name="maxrow" placeholder="Enter integer between -50 and 50">
            </div>
            <button type="submit"> Generate </button>
        </form>
    </fieldset>
    <fieldset id="table-fieldset">
        <legend> Multiplication Table:</legend>
        <div id="table-container"> </div>
    </fieldset>
</body>

</html>
