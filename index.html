<!DOCTYPE html>
<!--

-->
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!--   Stylesheet   -->
    <link rel="stylesheet" href="css/styles.css">

    <!--   Javascript   -->
    <script type="text/javascript" src="javascript/timestable.js"></script>

    <!--   Title   -->
    <title>Times Table</title>
</head>
<body>
    <header>
        <h1>
            Times Tables
        </h1>
    </header>
    <p>
        Please enter the following information to generate a times table:
    </p>
    <form onsubmit="generateTable(event); return false;">
        <div>
            <label> Minimum column value </label>
            <input type="number" name="mincol" placeholder="Enter integer between -100 and 100">
        </div>
        <br>
        <div>
            <label> Maximum column value </label>
            <input type="number" name="maxcol" placeholder="Enter integer between -100 and 100">
        </div>
        <br>
        <div>
            <label> Minimum row value </label>
            <input type="number" name="minrow" placeholder="Enter integer between -100 and 100">
        </div>
        <br>
        <div>
            <label> Maximum row value </label>
            <input type="number" name="maxrow" placeholder="Enter integer between -100 and 100">
        </div>
        <br>
        <button type="submit"> Submit </button>
    </form>
</body>
</html>
